<style>
:root{
  --bg:#EAEAE0; --card:#FBFBF6; --ink:#1C4670; --ink2:#2E5C8A;
  --teal:#278AB0; --green:#1DC690; --green-d:#0E9E6E;
  --amber:#C77B1F; --amber-bg:#FBEED4; --red:#C0503F; --red-bg:#F9E3DF;
  --line:#D8D6C8; --muted:#6B7280; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:0 12px;padding-bottom:110px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
input::placeholder,textarea::placeholder{color:#A9B2A4;font-style:italic}
h1,h2,h3{color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;margin:0 -12px 14px;padding:14px 16px;display:flex;align-items:center;gap:10px;border-radius:0 0 18px 18px;box-shadow:0 2px 10px rgba(28,70,112,.25)}
.hdr h1{font-size:1.2rem;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:.8rem;opacity:.8;display:block}
.hdr button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:1rem}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(28,70,112,.07)}
.card h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.right{margin-left:auto}
.center{text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:12px 16px;font-size:1rem;font-weight:600;background:var(--ink);color:#fff;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.teal{background:var(--teal)}

button:disabled{opacity:.45}

.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:600;background:#E3F0F6;color:var(--teal)}

.tabs button.on{background:var(--ink);color:#fff}

table.g th{background:var(--ink);color:#fff;font-weight:600;font-size:.78rem;position:sticky;top:0}
table.g td.nm,table.g th.nm{text-align:left;position:sticky;left:0;background:var(--card);min-width:130px;max-width:170px;overflow:hidden;text-overflow:ellipsis;z-index:2}
table.g th.nm{background:var(--ink)}
table.g td.gcell{cursor:pointer;min-width:44px;font-weight:600}
table.g td.gcell:active{background:#E3F0F6}
td.gcell.baja{color:var(--red)} td.gcell.ok{color:var(--ink)} td.gcell.alta{color:var(--green-d)}
td.gcell.ne{color:var(--amber);font-size:.75rem} td.gcell.au{color:var(--muted);font-size:.75rem}
td.fin{background:#EFF4F8;font-weight:800}
tr:nth-child(even) td{background:rgba(28,70,112,.025)} tr:nth-child(even) td.nm{background:#F3F2EA}
tr:nth-child(even) td.gcell:active{background:#E3F0F6}

.kpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.kpad button{padding:14px 0;font-size:1.25rem;font-weight:700;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.kpad button:active{background:#E3F0F6}
.kpad button.mark{font-size:.85rem;color:var(--amber);border-color:var(--amber-bg);background:var(--amber-bg)}
.kpad button.mark.au{color:var(--muted);background:#EFEEE6;border-color:#EFEEE6}
.kpad button.del{color:var(--red)}
.kpad button.ok{background:var(--green-d);color:#fff;border-color:var(--green-d)}

.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}

.bnav a .ico{display:block;margin-bottom:2px;opacity:.75}
.bnav a.on .ico{opacity:1}
.bnav a.on{color:#fff}

.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:2.4rem;display:block;margin-bottom:8px}
.sect{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:18px 0 8px}
.checklist{counter-reset:ck}
.checklist .card{counter-increment:ck}
.badge-n{background:var(--teal);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;flex:none}
.credits{text-align:center;font-size:.75rem;color:var(--muted);padding:18px 0 6px}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;flex:none}
.swatch.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.hero{position:relative;overflow:hidden;padding-bottom:38px}
.hero .mtn{position:absolute;left:0;right:0;bottom:0;pointer-events:none;line-height:0}
.tav{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.cropwrap{display:flex;justify-content:center;margin:10px 0}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--green);transition:width .2s}
@media (min-width:560px){ .kpad{grid-template-columns:repeat(6,1fr)} }

const NUMW={uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10};
function tokenIsGrade(w){
 w=norm(w);if(w in NUMW)return NUMW[w];
 if(/^\d{1,2}([.,]5)?$/.test(w)){const v=parseFloat(w.replace(',','.'));return v>=1&&v<=10?v:null}
 return null;
}
function isMarkToken(tokens,i){
 const w=tokens[i];
 if((w==='no'&&tokens[i+1]==='entrego')||(w==='no'&&tokens[i+1]==='entregó'))return 'NE';
 if(w==='entrego'&&tokens[i-1]==='no')return 'SKIP';
 if(w==='ausente'||w==='falta'||w==='falto'||w==='faltó')return 'AU';
 if(w==='presente')return 'SKIP';
 return null;
}
function matchStudent(nameStr,students){
 const ntok=norm(nameStr).split(' ').filter(t=>t.length>1);
 if(!ntok.length)return null;
 let best=null,bs=0;
 students.forEach(st=>{
   const ap=norm(st.apellido).split(' '),no=norm(st.nombre).split(' ');
   let score=0;
   ntok.forEach(t=>{ if(ap.some(a=>a===t||a.startsWith(t)||t.startsWith(a)))score+=2;
     else if(no.some(a=>a===t||a.startsWith(t)||t.startsWith(a)))score+=1;});
   if(score>bs){bs=score;best=st}else if(score===bs)best=null;
 });
 return bs>=2?best:null;
}
/* "Sánchez siete, González ocho, Pérez no entregó" -> [{name,value}] */
function parseGradeDictation(text,students){
 const toks=text.toLowerCase().split(/\s+/).map(t=>norm(t)).filter(Boolean);
 const out=[];let nameBuf=[];
 let i=0;
 while(i<toks.length){
   const w=toks[i];
   const mk=isMarkToken(toks,i);
   if(mk==='NE'){if(nameBuf.length){out.push({name:nameBuf.join(' '),value:'NE'});nameBuf=[]}i+=2;continue}
   if(mk==='AU'){if(nameBuf.length){out.push({name:nameBuf.join(' '),value:'AU'});nameBuf=[]}i++;continue}
   if(mk==='SKIP'){i++;continue}
   const g=tokenIsGrade(w);
   if(g!=null){
     let val=g;
     if(toks[i+1]==='y'&&toks[i+2]==='medio'){val=g+0.5;i+=2}
     else if(toks[i+1]==='medio'&&Number.isInteger(g)&&g<10){val=g+0.5;i+=1}
     else if(toks[i+1]==='con'&&toks[i+2]==='cinco'&&g<10){val=g+0.5;i+=2}
     if(nameBuf.length){out.push({name:nameBuf.join(' '),value:val});nameBuf=[]}
     i++;continue;
   }
   if(/^\d/.test(w)){if(nameBuf.length){out.push({name:nameBuf.join(' '),value:null});nameBuf=[]}i++;continue}
   nameBuf.push(w);i++;
 }
 if(nameBuf.length)out.push({name:nameBuf.join(' '),value:null});
 return out.map(o=>{const st=matchStudent(o.name,students);return{student:st,name:o.name,value:o.value,ok:!!(st&&o.value!=null)}});
}
function parseAttendanceDictation(text,students){
 const toks=text.split(/[,.]/).map(s=>s.trim()).filter(Boolean);
 const flat=toks.join(' ');
 const words=flat.toLowerCase().split(/\s+/).map(norm).filter(Boolean);
 const out=[];let buf=[];
 words.forEach(w=>{buf.push(w);const st=matchStudent(buf.join(' '),students);
   if(st){out.push(st);buf=[]}});
 if(buf.length)out.push({unmatched:buf.join(' ')});
 return out;
}

function parseClassDictation(text){

 const parts=text.split(/(?<=[:.!?])\s+|,\s*(?=(?:actividad|trabajaron|hicieron|guía|guia|observaci|ojo|tema|vimos|dí|di|expliqu|explicamos))/i);
 const obsRe=/(?:observaci[oó]n(?:es)?|ojo con|anotar?|anotá)(?:,)?\s*/i;
 let mode='tema';
 parts.forEach(p=>{
   p=p.trim();if(!p)return;
   if(obsRe.test(p)){const rest=p.replace(obsRe,'').replace(/^[:\s,.]+|^(que|anotá?\s+que)\s*/i,'').trim();if(rest)res.obs.push(rest);return}
   if(/^(?:las |la )?actividades?|trabajaron|hicieron|realizaron|guía|guia|ejercicios|práctica|practica|resolvieron|leyeron|dibujaron|entregué|entregue/i.test(p)){mode='act';res.actividades+=(res.actividades?' ':'')+p.replace(/^(?:las |la )?actividades?(?: realizadas| fueron|:)?\s*/i,'');return}
   if(/^(?:el )?tema/i.test(p)){res.tema+=(res.tema?' ':'')+p.replace(/^(?:el )?tema(?: del día| fue| es|:)?\s*/i,'');return}
   if(mode==='act')res.actividades+=(res.actividades?' ':'')+p;
   else res.tema+=(res.tema?' ':'')+p;
 });
 res.tema=res.tema.replace(/^(hoy\s+)?(vimos|dí|di|dieron|expliqué|explique|explicamos|dimos)\s+(el\s+tema\s+)?/i,'').trim();
 res.tema=res.tema.charAt(0).toUpperCase()+res.tema.slice(1);
 return res;
}
/* event dictation: "agendá examen de 1 A para el martes 12" */
function dateFromSpanish(text){
 const t=norm(text);const today=new Date();
 const dm=t.match(/(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/);
 if(dm){const mi=MONTHS.indexOf(dm[2]==='setiembre'?'septiembre':dm[2]);const y=mi<today.getMonth()|| (mi===today.getMonth()&&+dm[1]<today.getDate())?today.getFullYear()+1:today.getFullYear();return y+'-'+String(mi+1).padStart(2,'0')+'-'+String(dm[1]).padStart(2,'0')}
 if(/pasado ma/.test(t)){const d=new Date(today);d.setDate(d.getDate()+2);return todayISO(d)}
 if(/ma/.test(t)&&/mañana|manana/.test(t)){const d=new Date(today);d.setDate(d.getDate()+1);return todayISO(d)}
 const dow=t.match(/(lunes|martes|miercoles|jueves|viernes|sabado|domingo)(?:\s+(\d{1,2}))?/);
 if(dow){
   const names={lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,domingo:0};
   const want=names[dow[1]];const d=new Date(today);let add=(want-d.getDay()+7)%7;if(add===0&&!dow[2])add=7;
   if(dow[2]){ // weekday + day number -> find date in current/next month
     const day=+dow[2];const dt=new Date(today.getFullYear(),today.getMonth(),day);
     if(dt<today)dt.setMonth(dt.getMonth()+1);return todayISO(dt);
   }
   d.setDate(d.getDate()+add);return todayISO(d);
 }
 const n=t.match(/\b(?:el|para el)\s+(\d{1,2})\b/);
 if(n){const dt=new Date(today.getFullYear(),today.getMonth(),+n[1]);if(dt<today)dt.setMonth(dt.getMonth()+1);return todayISO(dt)}
 return null;
}
const ORDW={primero:'1',primer:'1',primera:'1',segundo:'2',segunda:'2',tercero:'3',tercera:'3',cuarto:'4',cuarta:'4',quinto:'5',quinta:'5',sexto:'6',sexta:'6',septimo:'7',septima:'7'};
function parseEventDictation(text){
 let t=norm(text);
 Object.keys(ORDW).forEach(w=>{t=t.replace(new RegExp('\\b'+w+'\\b','g'),ORDW[w])});
 let type='otro';
 if(/examen|prueba|evaluacion|parcial|oral|escrito|cuestionario/.test(t))type='examen';
 else if(/reunion/.test(t))type='reunion';
 else if(/acto|feriado|asueto|jornada/.test(t))type='acto';
 const date=dateFromSpanish(t);
 let courseId=null;
 const cm=t.match(/(\d)\s*([a-d])\b/);
 if(cm){const want=cm[1]+cm[2];const c=S.courses.find(c=>norm(c.name).replace(/\s|°/g,'')===want);if(c)courseId=c.id}
 return{type,date,courseId,raw:text.trim()};
}

function exportXLSX(cid,sid){

 const wb=XLSX.utils.book_new();
 [1,2,3].forEach(t=>{

     const avg=triAvg(c,sid,t,st.id);row['Promedio']=avg!=null?+avg.toFixed(1):'';row['Nota '+t+'°T']=avg!=null?roundAr(avg):'';
     return row;
   });
   const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{Estudiante:'(sin estudiantes)'}]);

function cap(s){return s.toLowerCase().replace(/(^|[\s\-'´`])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase()).trim()}
function ocrRoster(cid){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*,application/pdf';
 inp.onchange=async()=>{
   const f=inp.files[0];if(!f)return;
   sheet(`<h3>${ico('cam',22)} Leyendo la lista…</h3><p class="muted">Puede tardar unos segundos la primera vez.</p><div class="progress"><i id="opr" style="width:5%"></i></div><div id="ost" class="muted">Preparando…</div>`);
   try{
     await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
     let imgs=[];
     if(f.type==='application/pdf'){
       $('#ost').textContent='Leyendo PDF…';
       await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
       pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
       const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;
       for(let p=1;p<=Math.min(pdf.numPages,4);p++){
         const pg=await pdf.getPage(p);const vp=pg.getViewport({scale:2});
         const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
         await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
         imgs.push(cv.toDataURL('image/png'));
       }
     }else{$('#ost').textContent='Preparando imagen…';imgs=[await prepImg(f)]}
     let text='';let step=0;const total=imgs.length*2;
     for(let i=0;i<imgs.length;i++){
       const vars=await variantsOf(imgs[i]);
       for(const v of vars){
         step++;$('#ost').textContent=`Analizando imagen ${i+1} de ${imgs.length} (pasada ${step%2||2}/2)…`;
         const res=await Tesseract.recognize(v,'spa',{logger:m=>{if(m.status==='recognizing text')$('#opr').style.width=(5+(step-1+m.progress)/total*90)+'%'}});
         text+=res.data.text+'\n';
       }
     }
     const found=extractNames(text);
     if(!found.length){sheet(`<h3>No pude leer nombres</h3><p class="muted">Probá con una foto más nítida o un PDF, o cargá la lista a mano/por voz.</p><button class="btn big" onclick="closeSheet()">Cerrar</button>`);return}
     window.__roster=found.map(n=>({...n,on:true}));
     redrawRoster(cid);
   }catch(e){console.error(e);sheet(`<h3>Error leyendo el archivo</h3><p class="muted">${esc(e.message)}</p><button class="btn big" onclick="closeSheet()">Cerrar</button>`)}
 };
 inp.click();
}
function extractNames(text){
 const out=[];const seen=new Set();
 text.split('\n').forEach(l=>{
   l=l.trim();
   if(l.length<5||/total|fecha|curso|materia|escuela|divisi|página|aprob|justif|legajo|document|nombre y apellido|apellido y nombre|alumn|inasist/i.test(l))return;
   let cleaned=l.replace(/^\d+[\s,\.\-\)]*/,'').replace(/[a-záéíóúñüñA-Z]\d+/g,m=>m.replace(/\d+/g,''))
    .replace(/\b\d{4,}\b/g,' ').replace(/\b\d{1,3}[\.,][\d\.,]+\b/g,' ')
    .replace(/[|_·•▪◦●—–“”"'’]+/g,' ').replace(/\s+/g,' ').replace(/^[^\p{L}]+/u,'').trim();
   if(cleaned.length<5)return;
   const parts=cleaned.split(',').map(x=>x.trim()).filter(Boolean);
   let ap='',no='';
   if(parts.length>=2){ap=parts[0];no=parts.slice(1).join(' ')}
   else{
     const w=cleaned.split(' ').filter(x=>x.length>1&&/^[\p{L}'.\-]+$/u.test(x));
     if(w.length>=2&&w.length<=5){ap=w.slice(0,Math.ceil(w.length/2)).join(' ');no=w.slice(Math.ceil(w.length/2)).join(' ')}
   }
   ap=ap.trim();no=no.trim().replace(/\s+\S$/,'');
   if(ap&&no&&ap.length>1&&no.length>0){
     const k=norm(ap)+'|'+norm(no);if(seen.has(k))return;seen.add(k);
     out.push({apellido:cap(ap),nombre:cap(no)});
   }
 });
 return out;
}

 </div>

}

   c.students.push({id:uid(),apellido:r.apellido.trim(),nombre:r.nombre.trim()});
 });

function prepImg(f){return new Promise((res,rej)=>{const url=URL.createObjectURL(f);const img=new Image();
 img.onload=()=>{const M=2600;const k=Math.min(1,M/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('No pude leer la imagen'))};img.src=url})}
async function variantsOf(src){
 const cv=typeof src==='string'?await new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);res(c)};i.onerror=rej;i.src=src}):src;
 const w=cv.width,h=cv.height,ctx=cv.getContext('2d');
 const d=ctx.getImageData(0,0,w,h),p=d.data,n=w*h;
 const g=new Float32Array(n),hist=new Uint32Array(256);
 for(let i=0;i<n;i++){const v=(p[i*4]*0.299+p[i*4+1]*0.587+p[i*4+2]*0.114)|0;g[i]=v;hist[v]++}
 let lo=0,hi=255,acc=0;const loT=n*0.02,hiT=n*0.98;
 for(let i=0;i<256;i++){acc+=hist[i];if(acc>loT){lo=i;break}}
 acc=0;for(let i=0;i<256;i++){acc+=hist[i];if(acc>hiT){hi=i;break}}
 const rng=Math.max(30,hi-lo);
 const d2=ctx.createImageData(w,h),o=d2.data;
 for(let i=0;i<n;i++){let v=(g[i]-lo)*255/rng;v=v<0?0:v>255?255:v;const j=i*4;o[j]=o[j+1]=o[j+2]=v;o[j+3]=255}
 const out=[];
 const c1=document.createElement('canvas');c1.width=w;c1.height=h;c1.getContext('2d').putImageData(d2,0,0);
 out.push(c1.toDataURL('image/jpeg',0.92));
 const r=Math.max(10,Math.round(w/70));
 const ii=new Float64Array((w+1)*(h+1));
 for(let y=0;y<h;y++){let s=0;for(let x=0;x<w;x++){s+=g[y*w+x];ii[(y+1)*(w+1)+x+1]=ii[y*(w+1)+x+1]+s}}
 for(let y=0;y<h;y++){for(let x=0;x<w;x++){
  const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r),y0=Math.max(0,y-r),y1=Math.min(h-1,y+r);
  const sum=ii[(y1+1)*(w+1)+x1+1]-ii[y0*(w+1)+x1+1]-ii[(y1+1)*(w+1)+x0]+ii[y0*(w+1)+x0];
  const mean=sum/((x1-x0+1)*(y1-y0+1));
  const v=g[y*w+x]>mean-14?255:0;const j=(y*w+x)*4;o[j]=o[j+1]=o[j+2]=v}}
 ctx.putImageData(d2,0,0);
 out.push(cv.toDataURL('image/jpeg',0.92));
 return out;
}

function viewAlerts(el){
 const cards=[];
 S.courses.forEach(c=>{(c.subjects||[]).forEach(sub=>{
   c.students.forEach(st=>{
     const reasons=[];
     const triNow=currentTri();
     const avg=triAvg(c,sub.id,triNow,st.id);
     if(avg!=null&&avg<S.settings.aprobado)reasons.push(`promedio ${fmtAvg(avg)} (aprobado: ${S.settings.aprobado})`);
     if(triNow>1){
       const prev=triAvg(c,sub.id,triNow-1,st.id);
       if(avg!=null&&prev!=null&&avg<=prev-1)reasons.push(`bajó de ${fmtAvg(prev)} a ${fmtAvg(avg)} entre trimestres`);
     }
     let ne=0;S.evaluations.filter(e=>e.courseId===c.id&&e.subjectId===sub.id).forEach(e=>{if(gradeOf(e.id,st.id)==='NE')ne++});
     if(ne>=1)reasons.push(`${ne} evaluación${ne>1?'es':''} sin entregar`);
     if(c.attendanceOn){const au=countAusencias(c.id,st.id);if(au>=3)reasons.push(`${au} inasistencias`)}
     let obs=0;S.classLogs.filter(l=>l.courseId===c.id&&l.subjectId===sub.id).forEach(l=>{obs+=l.obs.filter(o=>o.stId===st.id).length});
     if(obs>=3)reasons.push(`${obs} observaciones acumuladas`);
     if(reasons.length)cards.push({st,c,sub,reasons});
   });
 })});
 cards.sort((a,b)=>b.reasons.length-a.reasons.length);
 el.innerHTML=header('Alertas','Estudiantes que necesitan tu atención')+`
 ${cards.length?`<p class="muted" style="margin-bottom:10px">${cards.length} estudiante${cards.length>1?'s':''} con señales. Pensado para hablar con ellos antes de que lleguen al desaprobado.</p>`:`
  <div class="empty"><span class="big">${ico('checkC',42)}</span>Ninguna alerta. Todo en orden.</div>`}
 ${cards.map(x=>`<div class="card">
   <h3>${stAvatar(x.st,30)} <a href="#/student/${x.c.id}/${x.st.id}" style="color:inherit;text-decoration:none;border-bottom:1px dashed var(--teal)">${esc(studentName(x.st))}</a><span class="chip ${x.reasons.length>=2?'red':'amber'}" style="margin-left:auto">${x.reasons.length>=2?'Atención':'A mirar'}</span></h3>
   <div class="muted" style="margin-bottom:6px">${esc(x.c.name)} · ${esc(x.sub.name)} · ${esc(schoolName(x.c.schoolId))}</div>
   ${x.reasons.map(r=>`<div class="flagline"><i>${ico('warn',18)}</i><div>${esc(r)}</div></div>`).join('')}
  </div>`).join('')}`+bnav('alerts');
}

function backup(){

function restore(){
 const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.courses)throw new Error('no');S=d;applyTheme();save();render();toast('Copia restaurada')}catch(x){toast('Archivo inválido')}};
  r.readAsText(f)};
 inp.click();
}
